name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Extension Zip Package
        run: |
          zip -r github-bilingual.zip \
            manifest.json \
            locals.js \
            README.md \
            LICENSE \
            content/ \
            popup/ \
            icons/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: github-bilingual.zip
          draft: false
          prerelease: false
          generate_release_notes: true
